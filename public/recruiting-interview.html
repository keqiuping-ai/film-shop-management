<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#073d49">
  <title>QUAD FILM 视频面试</title>
  <link rel="icon" href="/quad-film-icon-192.png">
  <link rel="stylesheet" href="/recruiting-interview.css?v=20260918-1">
  <script defer src="/livekit-client.umd.js?v=1"></script>
  <script defer src="/recruiting-interview.js?v=20260918-1"></script>
</head>
<body>
  <main class="interview-shell">
    <header class="brand"><img src="/quad-film-icon-192.png" alt=""><div><strong>QUAD FILM</strong><span>Secure video interview</span></div><span id="connectionBadge" class="badge">准备中</span></header>
    <section id="welcome" class="welcome card">
      <p class="eyebrow">VIDEO INTERVIEW · 视频面试</p>
      <h1 id="welcomeTitle">正在检查面试链接…</h1>
      <p id="welcomeMeta" class="muted"></p>
      <div class="device-check"><span>🎥 摄像头</span><span>🎙️ 麦克风</span><span>🔒 一次性安全链接</span></div>
      <label id="consentRow" class="consent"><input id="consent" type="checkbox">我了解本次面试将使用音频、视频及实时文字转写辅助记录；AI评分仅供招聘负责人参考，最终决定由人工完成。</label>
      <p id="error" class="error" role="alert"></p>
      <button id="join" class="primary" disabled>进入视频面试</button>
      <p class="privacy">无需注册或下载应用。浏览器只会在你同意后申请摄像头和麦克风权限；页面不会默认录制视频。</p>
    </section>
    <section id="roomView" class="room" hidden>
      <div class="stage card">
        <div id="remoteStage" class="remote-stage"><div class="waiting"><strong>正在等待另一位参与者…</strong><span>保持此页面打开，连接后会自动显示。</span></div></div>
        <div id="localStage" class="local-stage"><span>我的画面</span></div>
        <div id="audioStage" hidden></div>
      </div>
      <aside class="side card">
        <p class="eyebrow">INTERVIEW ASSISTANT</p>
        <h2>面试进行中</h2>
        <p id="participantState" class="muted">正在连接安全房间…</p>
        <div class="notice"><strong>AI辅助边界</strong><p>AI可以协助转写、整理证据和生成评分草稿，但不会根据外貌、口音或其他受保护特征作出判断。</p></div>
        <div class="controls">
          <button id="mic">🎙️ 麦克风</button><button id="camera">🎥 摄像头</button><button id="leave" class="danger">结束 / 离开</button>
        </div>
      </aside>
    </section>
  </main>
</body>
</html>
