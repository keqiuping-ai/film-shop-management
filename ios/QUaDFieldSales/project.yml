name: QUaDFieldSales
options:
  bundleIdPrefix: com.quadfilm
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  QUaDFieldSales:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: QUaD Field Sales
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: Your location is used only for authorized clock and customer-visit records.
        NSLocationAlwaysAndWhenInUseUsageDescription: During an active work shift, authorized background location records may be collected.
        NSCameraUsageDescription: The camera is used to capture customer-visit evidence.
        NSMicrophoneUsageDescription: The microphone is used to record authorized visit notes.
        QUAD_API_BASE_URL: http://127.0.0.1:3000
