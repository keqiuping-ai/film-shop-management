name: LidaField
options:
  bundleIdPrefix: com.quadfilm
  developmentLanguage: zh-Hans
  knownRegions:
    - zh-Hans
    - en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: 39U2MQ3H7U
targets:
  LidaField:
    type: application
    platform: iOS
    sources:
      - path: LidaField
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quadfilm.field
        PRODUCT_NAME: QUaDFieldSales
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: LidaField/Info.plist
      properties:
        CFBundleDisplayName: QUaD Field Sales
        CFBundleShortVersionString: 2.2.2
        CFBundleVersion: "9"
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: 用于将现场沟通语音转换为会议纪要；语音会分段安全保存并同步至公司系统。
        NSSpeechRecognitionUsageDescription: 用于把客户洽谈内容转为文字并生成会议纪要。
        NSCameraUsageDescription: 客户门头和现场业务凭证仅允许使用相机即时拍摄，禁止从相册选取。
        NSLocationWhenInUseUsageDescription: 用于上下班与拜访记录；系统会综合使用卫星、Wi-Fi、蜂窝网络及手机当前可用位置，并保存定位精度。
        NSLocationAlwaysAndWhenInUseUsageDescription: 仅在上班期间每五分钟记录一次外勤位置；下班后立即停止。
        UIBackgroundModes:
          - audio
          - location
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.quadfilm.field.upload
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
